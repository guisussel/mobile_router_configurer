# Xcode project definition. On a Mac:
#   brew install xcodegen && cd iosApp && xcodegen && open iosApp.xcodeproj
name: iosApp
options:
  bundleIdPrefix: com.roteador
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Personal use: sign with your own (free) Apple ID team in Xcode.
    CODE_SIGN_STYLE: Automatic
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Roteador
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iOS 14+ asks before an app talks to devices on the local network.
        NSLocalNetworkUsageDescription: O app conversa com o seu roteador na rede local para mostrar e alterar as configurações.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roteador.app
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
